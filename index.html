
<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Finalexam — 應用程式總覽</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    // optional tailwind theme tweaks (soft pastel tones)
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            pastel: {
              50: '#fbf9ff',
              100: '#f6f0ff',
              200: '#eadaff',
              300: '#d7c7ff',
              400: '#c4a8ff',
              500: '#b488ff',
              600: '#8f5cff',
              700: '#6b3dd6',
              800: '#4b2b9a',
              900: '#2f1a63'
            }
          }
        }
      }
    }
  </script>
  <style>
    /* small helper to keep preview image responsive inside modal */
    .preview-img { max-width:100%; max-height:100%; object-fit:contain; border-radius:8px; }
  </style>
</head>
<body class="min-h-screen bg-gradient-to-b from-pastel-50 via-white to-pastel-100 text-gray-800 antialiased">
  <div class="max-w-6xl mx-auto px-6 py-12">
    <header class="mb-8">
      <div class="flex items-center gap-4">
        <div class="w-12 h-12 rounded-xl bg-gradient-to-br from-pastel-200 to-pastel-400 shadow-md flex items-center justify-center">
          <svg class="w-7 h-7 text-white" viewBox="0 0 24 24" fill="none"><path d="M3 7h18M6 11h12M8 15h8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
        <div>
          <h1 class="text-2xl font-semibold text-pastel-800">Finalexam — 應用程式總覽</h1>
          <p class="text-sm text-pastel-700 mt-1">溫柔唯美的介面：點擊卡片或使用 Enter 檢視與預覽應用程式</p>
        </div>
      </div>
    </header>

    <div class="flex gap-4 items-center mb-8">
      <div class="flex-1">
        <label for="quickSearch" class="sr-only">搜尋卡片</label>
        <input id="quickSearch" type="search" placeholder="搜尋：game / utility / digital" class="w-full bg-white/80 backdrop-blur-sm border border-pastel-200 rounded-xl px-4 py-3 shadow-sm focus:outline-none focus:ring-2 focus:ring-pastel-300 transition" />
      </div>
      <div>
        <button id="openInEditor" class="px-4 py-3 rounded-xl bg-gradient-to-r from-pastel-300 to-pastel-400 text-white shadow-md hover:scale-105 transition">在 VS Code 開啟</button>
      </div>
    </div>

    <main>
      <div id="cards" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
        <!-- Card: Digital learning -->
        <article tabindex="0" role="button" data-link="Digital learning/" class="card group relative rounded-2xl p-6 bg-white/60 backdrop-blur-sm border border-white/60 shadow-lg hover:shadow-2xl transform transition hover:-translate-y-2 focus:outline-none focus:ring-4 focus:ring-pastel-200">
          <div class="flex items-start gap-4">
            <div class="w-14 h-14 rounded-lg bg-gradient-to-br from-pastel-200 to-pastel-300 flex items-center justify-center">
              <svg class="w-7 h-7 text-white" viewBox="0 0 24 24" fill="none"><path d="M3 7h18M6 11h12M8 15h8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </div>
            <div>
              <h3 class="text-lg font-semibold text-pastel-800">Digital learning</h3>
              <p class="text-sm text-pastel-700 mt-1">互動教學、練習與教材展示 — 適合課程演示與練習。</p>
              <div class="mt-4 flex items-center gap-3">
                <span class="text-xs px-3 py-1 rounded-full bg-pastel-100 text-pastel-700">教學</span>
                <div class="flex-1"></div>
                <button data-action="preview" class="px-3 py-2 rounded-lg bg-white/70 text-pastel-800 hover:scale-105 transition text-sm">預覽</button>
                <a href="Digital learning/" target="_blank" rel="noopener" class="ml-2 px-3 py-2 rounded-lg bg-gradient-to-r from-pastel-300 to-pastel-400 text-white text-sm">開啟</a>
              </div>
            </div>
          </div>
        </article>

        <!-- Card: Game -->
        <article tabindex="0" role="button" data-link="Game/" class="card group relative rounded-2xl p-6 bg-white/60 backdrop-blur-sm border border-white/60 shadow-lg hover:shadow-2xl transform transition hover:-translate-y-2 focus:outline-none focus:ring-4 focus:ring-pastel-200">
          <div class="flex items-start gap-4">
            <div class="w-14 h-14 rounded-lg bg-gradient-to-br from-pastel-300 to-pastel-400 flex items-center justify-center">
              <svg class="w-7 h-7 text-white" viewBox="0 0 24 24" fill="none"><path d="M6 12h12M12 6v12" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </div>
            <div>
              <h3 class="text-lg font-semibold text-pastel-800">Game</h3>
              <p class="text-sm text-pastel-700 mt-1">小型遊戲與互動範例，充滿趣味的練習場域。</p>
              <div class="mt-4 flex items-center gap-3">
                <span class="text-xs px-3 py-1 rounded-full bg-pastel-100 text-pastel-700">娛樂</span>
                <div class="flex-1"></div>
                <button data-action="preview" class="px-3 py-2 rounded-lg bg-white/70 text-pastel-800 hover:scale-105 transition text-sm">預覽</button>
                <a href="Game/" target="_blank" rel="noopener" class="ml-2 px-3 py-2 rounded-lg bg-gradient-to-r from-pastel-300 to-pastel-400 text-white text-sm">開啟</a>
              </div>
            </div>
          </div>
        </article>

        <!-- Card: Utility tools -->
        <article tabindex="0" role="button" data-link="Utility tools/" class="card group relative rounded-2xl p-6 bg-white/60 backdrop-blur-sm border border-white/60 shadow-lg hover:shadow-2xl transform transition hover:-translate-y-2 focus:outline-none focus:ring-4 focus:ring-pastel-200">
          <div class="flex items-start gap-4">
            <div class="w-14 h-14 rounded-lg bg-gradient-to-br from-pastel-200 to-pastel-300 flex items-center justify-center">
              <svg class="w-7 h-7 text-white" viewBox="0 0 24 24" fill="none"><path d="M4 7h16M4 12h8M4 17h12" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </div>
            <div>
              <h3 class="text-lg font-semibold text-pastel-800">Utility tools</h3>
              <p class="text-sm text-pastel-700 mt-1">格式化、轉換與測試輔助工具集合。</p>
              <div class="mt-4 flex items-center gap-3">
                <span class="text-xs px-3 py-1 rounded-full bg-pastel-100 text-pastel-700">工具</span>
                <div class="flex-1"></div>
                <button data-action="preview" class="px-3 py-2 rounded-lg bg-white/70 text-pastel-800 hover:scale-105 transition text-sm">預覽</button>
                <a href="Utility tools/" target="_blank" rel="noopener" class="ml-2 px-3 py-2 rounded-lg bg-gradient-to-r from-pastel-300 to-pastel-400 text-white text-sm">開啟</a>
              </div>
            </div>
          </div>
        </article>
      </div>
    </main>

    <footer class="mt-10 text-center text-sm text-pastel-700">
      可用方向鍵移動焦點、按 Enter 開啟。欲在 VS Code 打開請在終端執行 <code class="bg-white/80 px-2 py-0.5 rounded">code .</code>
    </footer>
  </div>

  <!-- Modal -->
  <div id="modal" class="fixed inset-0 z-50 hidden items-center justify-center bg-black/40">
    <div class="w-[min(880px,92%)] bg-white rounded-2xl p-6 shadow-2xl">
      <div class="flex items-center justify-between mb-4">
        <h4 id="modalTitle" class="text-lg font-semibold text-pastel-800"></h4>
        <button id="modalClose" class="text-sm text-pastel-700 bg-pastel-50 px-3 py-1 rounded-lg">關閉</button>
      </div>
      <div class="h-[420px] bg-pastel-50 rounded-lg border border-white/60 flex items-center justify-center overflow-hidden">
        <div id="modalPreview" class="w-full h-full flex items-center justify-center text-pastel-700">載入預覽…</div>
      </div>
      <div class="mt-4 flex justify-end gap-3">
        <a id="modalOpen" class="px-4 py-2 rounded-lg bg-gradient-to-r from-pastel-300 to-pastel-400 text-white" href="#" target="_blank" rel="noopener">在新分頁開啟</a>
      </div>
    </div>
  </div>

  <script>
    // 基本互動：搜尋、焦點、卡片點擊、預覽 modal
    const quick = document.getElementById('quickSearch');
    quick.addEventListener('input', e=>{
      const q = e.target.value.trim().toLowerCase();
      document.querySelectorAll('#cards article').forEach(card=>{
        const txt = (card.innerText||'').toLowerCase();
        card.style.display = q && !txt.includes(q) ? 'none' : '';
      });
    });

    document.getElementById('openInEditor').addEventListener('click', e=>{
      e.preventDefault();
      alert('請在專案資料夾的終端執行：code . 以在 VS Code 中開啟');
    });

    const cards = Array.from(document.querySelectorAll('#cards article'));
    cards.forEach(card=>{
      // simple entrance (fade up)
      card.classList.add('opacity-0', 'translate-y-4');
      requestAnimationFrame(()=> {
        setTimeout(()=> card.classList.remove('opacity-0','translate-y-4'), 80);
      });

      // click to open (ignore clicks on buttons/links)
      card.addEventListener('click', e=>{
        if (e.target.closest('button') || e.target.closest('a')) return;
        const link = card.getAttribute('data-link') || '#';
        window.open(link,'_blank');
      });

      // keyboard support
      card.addEventListener('keydown', e=>{
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          const link = card.getAttribute('data-link') || '#';
          window.open(link,'_blank');
        }
      });

      // subtle pointer tilt (small)
      card.addEventListener('pointermove', e=>{
        const rect = card.getBoundingClientRect();
        const px = (e.clientX - rect.left) / rect.width - 0.5;
        const py = (e.clientY - rect.top) / rect.height - 0.5;
        const rx = -py * 4; const ry = px * 6;
        card.style.transform = `perspective(700px) rotateX(${rx}deg) rotateY(${ry}deg) translateZ(0)`;
      });
      card.addEventListener('pointerleave', ()=>{ card.style.transform = '' });
    });

    // modal preview
    const modal = document.getElementById('modal');
    const modalTitle = document.getElementById('modalTitle');
    const modalPreview = document.getElementById('modalPreview');
    const modalOpen = document.getElementById('modalOpen');
    const modalClose = document.getElementById('modalClose');

    document.querySelectorAll('[data-action="preview"]').forEach(btn=>{
      btn.addEventListener('click', e=>{
        e.stopPropagation();
        const card = e.target.closest('article');
        const name = card.querySelector('h3').innerText;
        const link = card.getAttribute('data-link') || '#';
        modalTitle.textContent = `預覽：${name}`;
        modalPreview.textContent = '載入預覽…';
        modalOpen.href = link;
        modal.classList.remove('hidden');

        // 嘗試載入 preview.png 或顯示說明
        const img = new Image();
        img.className = 'preview-img';
        img.onload = () => { modalPreview.innerHTML = ''; modalPreview.appendChild(img); };
        img.onerror = () => { modalPreview.textContent = '無預覽圖，請按「在新分頁開啟」檢視內容。'; };
        img.src = `${link}preview.png`;
      });
    });

    modalClose.addEventListener('click', ()=> modal.classList.add('hidden'));
    modal.addEventListener('click', e=> { if (e.target === modal) modal.classList.add('hidden'); });
    document.addEventListener('keydown', e=> { if (e.key === 'Escape') modal.classList.add('hidden'); });

    // keyboard navigation with arrows
    let idx = 0;
    function focusCard(i){ cards[i] && cards[i].focus(); }
    document.addEventListener('keydown', e=>{
      const focused = document.activeElement;
      if (!['ArrowRight','ArrowLeft','ArrowUp','ArrowDown'].includes(e.key)) return;
      e.preventDefault();
      const visible = cards.filter(c=> c.style.display !== 'none');
      if (!visible.length) return;
      const currentIndex = visible.indexOf(focused) >= 0 ? visible.indexOf(focused) : 0;
      if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
        const next = (currentIndex + 1) % visible.length;
        visible[next].focus();
      } else {
        const prev = (currentIndex - 1 + visible.length) % visible.length;
        visible[prev].focus();
      }
    });
  </script>
</body>
</html>
