      { text: '召集雙方領袖召開「創傷共感懇談會」，讓大家卸下武裝，吐露長年爭端背後的脆弱與苦衷。', scores: { analytical: 0, creative: 0, empathetic: 25, resilient: 5 } },

    text: '當遭遇突如其來的「深空沙塵暴」導致通訊全部中斷、維生系統僅剩 24 小時，你第一時間會？',
    type: 'single',
    options: [
      { text: '關閉非必要電路，計算出最完美的能量分配公式，以秒為單位最大化存活時間。', scores: { analytical: 25, creative: 0, empathetic: 0, resilient: 10 } },
      { text: '利用僅剩的感測器殘留波頻，天馬行空地改裝太陽能帆板來嘗試捕捉星際靜電。', scores: { analytical: 5, creative: 25, empathetic: 0, resilient: 0 } },
      { text: '主動擁抱並安撫身邊驚慌失措的夥伴，帶領大家在溫暖的氛圍中保持希望。', scores: { analytical: 0, creative: 0, empathetic: 25, resilient: 10 } },
      { text: '毫不慌亂，立刻拿起手動工具走向最危險的破裂艙口，用血肉之軀頂住氣壓傾瀉。', scores: { analytical: 0, creative: 0, empathetic: 5, resilient: 25 } }

function App() {
  // ==========================================
  // STATE MANAGEMENT
  // ==========================================
  const [user, setUser] = useState(null);
  const [authLoading, setAuthLoading] = useState(true);
  const [activeTab, setActiveTab] = useState('home'); // 'home', 'test', 'history', 'crud', 'leaderboard'
  
  // 使用者相關
  const [username, setUsername] = useState('');
  const [avatar, setAvatar] = useState('💫');
  const [showProfileModal, setShowProfileModal] = useState(false);

  // 測驗題庫狀態 (預設為 DEFAULT_QUESTIONS 確保骨架屏前仍能渲染安全畫面)
  const [questions, setQuestions] = useState(DEFAULT_QUESTIONS);
  const [isQuestionsLoading, setIsQuestionsLoading] = useState(true);
  
  // 進行測驗中狀態
  const [quizProgress, setQuizProgress] = useState({
    currentIndex: 0,
    answers: {}, // questionId: selectedIndex[]
    scores: { analytical: 0, creative: 0, empathetic: 0, resilient: 0 }
  });
  
  // 歷史測驗紀錄
  const [histories, setHistories] = useState([]);
  
  // 全球分析排行榜
  const [globalRankings, setGlobalRankings] = useState([]);

  // 當前生成的測驗報告
  const [currentReport, setCurrentReport] = useState(null);
  const [isGeneratingAI, setIsGeneratingAI] = useState(false);
  const [aiAnalysisResult, setAiAnalysisResult] = useState('');
  const [shareModalOpen, setShareModalOpen] = useState(false);

  // 新增：音效與互動加值狀態
  const [soundEnabled, setSoundEnabled] = useState(true);
  const [resonanceTarget, setResonanceTarget] = useState(null); // 雙人共鳴比對目標
  const [stardustXp, setStardustXp] = useState(0); // 星塵XP系統

  // CRUD 管理員狀態
  const [isAdmin, setIsAdmin] = useState(true); // 預設開啟方便展示
  const [crudModal, setCrudModal] = useState({ open: false, mode: 'add', question: null });
  const [crudForm, setCrudForm] = useState({
    id: '',
    text: '',
    type: 'single',
    options: [
      { text: '', scores: { analytical: 0, creative: 0, empathetic: 0, resilient: 0 } },
      { text: '', scores: { analytical: 0, creative: 0, empathetic: 0, resilient: 0 } },
      { text: '', scores: { analytical: 0, creative: 0, empathetic: 0, resilient: 0 } },
      { text: '', scores: { analytical: 0, creative: 0, empathetic: 0, resilient: 0 } }
    ]
  });

  // 通知系統
  const [toast, setToast] = useState({ show: false, message: '', type: 'info' });

  const triggerToast = (message, type = 'info') => {
    setToast({ show: true, message, type });
    setTimeout(() => {
      setToast({ show: false, message: '', type: 'info' });
    }, 3500);
  };

  // 音效合成器函數：由瀏覽器底層即時發聲（短暫建立 AudioContext）
  const playSynthTone = (type) => {
    if (!soundEnabled) return;
    try {
      const AudioContext = window.AudioContext || window.webkitAudioContext;
      if (!AudioContext) return;
      const ctx = new AudioContext();

      if (type === 'click') {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);

        osc.frequency.setValueAtTime(1046.50, ctx.currentTime); // C6 Note
        osc.type = 'triangle';
        gain.gain.setValueAtTime(0.04, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.15);
        osc.start();
        osc.stop(ctx.currentTime + 0.15);
      } else if (type === 'success') {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        
        osc.frequency.setValueAtTime(329.63, ctx.currentTime); // E4
        osc.frequency.exponentialRampToValueAtTime(880, ctx.currentTime + 0.35); // A5
        osc.type = 'sine';
        gain.gain.setValueAtTime(0.06, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.4);
        osc.start();
        osc.stop(ctx.currentTime + 0.4);
      } else if (type === 'crud') {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        
        osc.frequency.setValueAtTime(196.00, ctx.currentTime); // G3
        osc.type = 'sine';
        gain.gain.setValueAtTime(0.08, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.25);
        osc.start();
        osc.stop(ctx.currentTime + 0.25);
      }
    } catch (e) {
      console.warn("AudioContext blocked or not allowed:", e);
    }
  };

  // 實時動態 Canvas 宇宙星沙背景
  useEffect(() => {
    const canvas = document.getElementById('stellar-canvas');
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    if (!ctx) return;

    let animationFrameId;
    let particles = [];
    const particleCount = 45;

    const resizeCanvas = () => {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    };
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    // 初始化星砂
    for (let i = 0; i < particleCount; i++) {
      particles.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        size: Math.random() * 1.8 + 0.2,
        speedX: Math.random() * 0.15 - 0.075,
        speedY: Math.random() * 0.15 - 0.075,
        opacity: Math.random() * 0.5 + 0.1
      });
    }

    let mouseX = 0;
    let mouseY = 0;
    const handleMouseMove = (e) => {
      mouseX = e.clientX;
      mouseY = e.clientY;
    };
    window.addEventListener('mousemove', handleMouseMove);

    const animate = () => {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      
      particles.forEach((p) => {
        p.x += p.speedX;
        p.y += p.speedY;

        // 滑鼠引力微幅交互
        const dx = mouseX - p.x;
        const dy = mouseY - p.y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < 180) {
          p.x += (dx / dist) * 0.15;
          p.y += (dy / dist) * 0.15;
        }

        // 邊界回彈
        if (p.x < 0 || p.x > canvas.width) p.speedX *= -1;
        if (p.y < 0 || p.y > canvas.height) p.speedY *= -1;

        ctx.fillStyle = `rgba(167, 139, 250, ${p.opacity})`;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
      });

      animationFrameId = requestAnimationFrame(animate);
    };
    animate();

    return () => {
      cancelAnimationFrame(animationFrameId);
      window.removeEventListener('resize', resizeCanvas);
      window.removeEventListener('mousemove', handleMouseMove);
    };
  }, []);

  // ==========================================
  // 2. FIREBASE AUTH & SYNCHRONIZATION
  // ==========================================
  useEffect(() => {
    // 讀取星塵XP系統
    const savedXp = localStorage.getItem('local_stardust_xp');
    if (savedXp) setStardustXp(parseInt(savedXp));

    if (!isFirebaseActive || !authInstance) {
      // 本地模擬登入
      const savedUser = localStorage.getItem('local_user');
      if (savedUser) {
        setUser(JSON.parse(savedUser));
      } else {
        const anonymousUser = { uid: 'local_user_guest_' + Math.random().toString(36).substr(2, 9), displayName: '星際旅人', avatar: '🪐', isAnonymous: true };
        setUser(anonymousUser);
        localStorage.setItem('local_user', JSON.stringify(anonymousUser));
      }
      setAuthLoading(false);
      setIsQuestionsLoading(false);
      
      // 載入本地快取的題目與歷史紀錄
      const savedQs = localStorage.getItem('local_questions');
      if (savedQs) setQuestions(JSON.parse(savedQs));
      const savedHist = localStorage.getItem('local_histories');
      if (savedHist) setHistories(JSON.parse(savedHist));
      const savedGlobal = localStorage.getItem('local_global_rankings');
      if (savedGlobal) setGlobalRankings(JSON.parse(savedGlobal));
      return;
    }

    // 啟動 Firebase 認證 (Rule 3: Auth first)
    const initAuth = async () => {
      try {
        if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
          await signInWithCustomToken(authInstance, __initial_auth_token);
        } else {
          await signInAnonymously(authInstance);
        }
      } catch (error) {
        console.error("Firebase auth flow failed, entering simulated mode:", error);
      }
    };
    initAuth();

    const unsubscribeAuth = onAuthStateChanged(authInstance, (currentUser) => {
      if (currentUser) {
        const userDocRef = doc(dbInstance, 'artifacts', appId, 'users', currentUser.uid, 'profile');
        getDoc(userDocRef).then((snapshot) => {
          if (snapshot.exists()) {
            setUser({ ...currentUser, ...snapshot.data() });
          } else {
            const defaultProfile = { displayName: '星際旅人', avatar: '🪐', uid: currentUser.uid };
            setDoc(userDocRef, defaultProfile).catch(e => console.error(e));
            setUser({ ...currentUser, ...defaultProfile });
          }
        }).catch(err => {
          console.error("Error reading profile:", err);
          setUser({ ...currentUser, displayName: '星際旅人', avatar: '🪐' });
        });
      } else {
        setUser(null);
      }
      setAuthLoading(false);
    });

    return () => unsubscribeAuth();
  }, []);

  // ==========================================
  // 3. FIRESTORE REAL-TIME DATA SYNC
  // ==========================================
  useEffect(() => {
    if (!user || !isFirebaseActive || !dbInstance) return;

    // A. 實時同步「題庫」公共數據 (徹底拆除 onSnapshot 內部的 setDoc 以防止無限更新迴圈)
    const qCol = collection(dbInstance, 'artifacts', appId, 'public', 'data', 'questions');
    const unsubscribeQuestions = onSnapshot(qCol, (snapshot) => {
      const qs = [];
      snapshot.forEach(doc => {
        qs.push({ id: doc.id, ...doc.data() });
      });
      
      if (qs.length > 0) {
        setQuestions(qs);
      } else {
        setQuestions(DEFAULT_QUESTIONS);
      }
      setIsQuestionsLoading(false);
    }, (error) => {
      console.error("Questions synchronization error:", error);
      setIsQuestionsLoading(false);
    });

    // B. 實時同步「歷史紀錄」私有數據
    const hCol = collection(dbInstance, 'artifacts', appId, 'users', user.uid, 'history');
    const unsubscribeHistory = onSnapshot(hCol, (snapshot) => {
      const hist = [];
      snapshot.forEach(doc => {
        const data = doc.data();
        if (data) hist.push({ id: doc.id, ...data });
      });
      hist.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));
      setHistories(hist);
    }, (error) => {
      console.error("History synchronization error:", error);
    });

    // C. 實時同步「全球分析排行榜 / 分享牆」
    const rCol = collection(dbInstance, 'artifacts', appId, 'public', 'data', 'global_results');
    const unsubscribeRankings = onSnapshot(rCol, (snapshot) => {
      const ranks = [];
      snapshot.forEach(doc => {
        const data = doc.data();
        if (data) ranks.push({ id: doc.id, ...data });
      });
      ranks.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));
      setGlobalRankings(ranks);
    }, (error) => {
      console.error("Global rankings synchronization error:", error);
    });

    return () => {
      unsubscribeQuestions();
      unsubscribeHistory();
      unsubscribeRankings();
    };
  }, [user]);

  // ==========================================
  // 4. BUSINESS LOGIC: USER MANAGEMENT
  // ==========================================
  const handleSaveProfile = async (e) => {
    e.preventDefault();
    if (!username.trim()) return;

    const updatedProfile = {
      displayName: username.trim(),
      avatar: avatar
    };

    playSynthTone('click');
    if (isFirebaseActive && user && dbInstance) {
      try {
        const userDocRef = doc(dbInstance, 'artifacts', appId, 'users', user.uid, 'profile');
        await setDoc(userDocRef, updatedProfile, { merge: true });
        setUser(prev => ({ ...prev, ...updatedProfile }));

  const handleSelectAnswer = (qId, optionIndex, isMultiple) => {
    playSynthTone('click');
    const currentAnswers = quizProgress.answers[qId] || [];
    let updated = [];

    if (isMultiple) {
      if (currentAnswers.includes(optionIndex)) {
        updated = currentAnswers.filter(idx => idx !== optionIndex);
      } else {
        updated = [...currentAnswers, optionIndex];
      }
    } else {
      updated = [optionIndex];
    }

    setQuizProgress(prev => ({
      ...prev,
      answers: {
        ...prev.answers,
        [qId]: updated
      }
    }));
  };

  const calculateResults = () => {
    let finalScores = { analytical: 0, creative: 0, empathetic: 0, resilient: 0 };
    let totalPossible = { analytical: 0, creative: 0, empathetic: 0, resilient: 0 };

    questions.forEach(q => {
      const selected = quizProgress.answers[q.id] || [];
      
      q.options?.forEach(opt => {
        totalPossible.analytical += (opt.scores?.analytical ?? 0);
        totalPossible.creative += (opt.scores?.creative ?? 0);
        totalPossible.empathetic += (opt.scores?.empathetic ?? 0);
        totalPossible.resilient += (opt.scores?.resilient ?? 0);
      });

      selected.forEach(idx => {
        const option = q.options?.[idx];
        if (option) {
          finalScores.analytical += (option.scores?.analytical ?? 0);
          finalScores.creative += (option.scores?.creative ?? 0);
          finalScores.empathetic += (option.scores?.empathetic ?? 0);
          finalScores.resilient += (option.scores?.resilient ?? 0);
        }
      });
    });

    const convertToPercentage = (score, total) => {
      if (total === 0) return 50; 
      const pct = Math.round((score / (total * 0.4)) * 100); 
      return Math.min(100, Math.max(10, pct)); 
    };

    const result = {
      analytical: convertToPercentage(finalScores.analytical, totalPossible.analytical),
      creative: convertToPercentage(finalScores.creative, totalPossible.creative),
      empathetic: convertToPercentage(finalScores.empathetic, totalPossible.empathetic),
      resilient: convertToPercentage(finalScores.resilient, totalPossible.resilient)
    };

    return result;
  };

  const RadarChart = ({ scores, compareScores = null, size = 300 }) => {
    const center = size / 2;
    const r = size * 0.35; 
    
    const angleMap = [
      { name: '創新探索', key: 'creative', x: center, y: center - r, lx: center, ly: center - r - 15 },

      { name: '理性思維', key: 'analytical', x: center, y: center + r, lx: center, ly: center + r + 20 },
      { name: '逆境韌性', key: 'resilient', x: center - r, y: center, lx: center - r - 30, ly: center + 4 }
    ];

    const getPoint = (index, value) => {
      const percentage = (value ?? 50) / 100;
      switch (index) {
        case 0: return { x: center, y: center - r * percentage }; 
        case 1: return { x: center + r * percentage, y: center }; 
        case 2: return { x: center, y: center + r * percentage }; 
        case 3: return { x: center - r * percentage, y: center }; 
        default: return { x: center, y: center };
      }
    };

    // 第一人數據 (使用者)
    const p0 = getPoint(0, scores?.creative ?? 50);
    const p1 = getPoint(1, scores?.empathetic ?? 50);
    const p2 = getPoint(2, scores?.analytical ?? 50);
    const p3 = getPoint(3, scores?.resilient ?? 50);
    const polygonPoints = `${p0.x},${p0.y} ${p1.x},${p1.y} ${p2.x},${p2.y} ${p3.x},${p3.y}`;

    let comparePolygonPoints = "";
    let cp0, cp1, cp2, cp3;
    if (compareScores) {
      cp0 = getPoint(0, compareScores.creative ?? 50);
      cp1 = getPoint(1, compareScores.empathetic ?? 50);
      cp2 = getPoint(2, compareScores.analytical ?? 50);
      cp3 = getPoint(3, compareScores.resilient ?? 50);
      comparePolygonPoints = `${cp0.x},${cp0.y} ${cp1.x},${cp1.y} ${cp2.x},${cp2.y} ${cp3.x},${cp3.y}`;
    }

    return (
      <div className="flex flex-col items-center justify-center">
        <svg width={size} height={size} className="overflow-visible">
          {[0.25, 0.5, 0.75, 1.0].map((scale, i) => {
            const sizeVal = r * scale;
            return (
              <polygon
                key={i}
                points={`
                  ${center},${center - sizeVal} 
                  ${center + sizeVal},${center} 
                  ${center},${center + sizeVal} 
                  ${center - sizeVal},${center}
                `}
                fill="none"
                stroke="rgba(124, 58, 237, 0.15)"
                strokeWidth="1"
                strokeDasharray={i === 3 ? "0" : "3,3"}

          <line x1={center} y1={center - r} x2={center} y2={center + r} stroke="rgba(124, 58, 237, 0.25)" strokeWidth="1" />
          <line x1={center - r} y1={center} x2={center + r} y2={center} stroke="rgba(124, 58, 237, 0.25)" strokeWidth="1" />

          {/* 繪製比較目標 (底部層) */}
          {compareScores && (
            <polygon
              points={comparePolygonPoints}
              fill="rgba(16, 185, 129, 0.18)"
              stroke="rgba(16, 185, 129, 0.85)"
              strokeWidth="2"
              strokeDasharray="4,4"
            />

          {/* 繪製當前使用者 (頂部層) */}

            points={polygonPoints}
            fill="url(#radarGradient)"
            stroke="rgba(167, 139, 250, 1)"

              key={i}

              cy={pt.y}
              r="4.5"
              fill="#fff"
              stroke="#8b5cf6"

        </svg>

    );

              ) / 4;
              // 共鳴度百分比
              const matchPct = Math.max(10, Math.min(100, Math.round(100 - diff)));
              
              let evaluationText = "頻率相異，但正好互補彼此的盲區！";
              if (matchPct >= 85) evaluationText = "極度完美的星際雙子，你們在全星區同頻共振！";
              else if (matchPct >= 65) evaluationText = "波頻高度默契，非常適合跨星際協作前行。";

              return (
                <div className="space-y-3">
                  <div className="flex justify-between items-center bg-violet-950/20 border border-violet-800/40 p-3 rounded-lg text-xs">
                    <div className="flex items-center space-x-2">
                      <span className="text-base">{resonanceTarget.user.avatar}</span>
                      <span className="font-bold">{resonanceTarget.user.displayName}</span>
                    </div>
                    <span className="text-violet-400 font-mono font-black text-sm">{matchPct}% 共鳴對齊度</span>
                    <div className="flex items-center space-x-2">
                      <span className="font-bold">{resonanceTarget.target.displayName}</span>
                      <span className="text-base">{resonanceTarget.target.avatar}</span>
                    </div>
                  </div>

                  <p className="text-2xs text-slate-300 text-center italic bg-slate-950/50 p-2 rounded border border-slate-900">
                    {evaluationText}
                  </p>
                </div>
              );
            })()}

            <button 
              onClick={() => setResonanceTarget(null)}
              className="w-full mt-4 py-2 bg-slate-950 border border-slate-800 text-xs text-slate-400 rounded-lg hover:text-white transition-all"
            >
              關閉共鳴觀測
            </button>
          </div>
        </div>
      )}

      {/* ==========================================
          TOAST NOTIFICATION COMPONENT
          ========================================== */}
      {toast.show && (
        <div className="fixed bottom-6 right-6 z-50 animate-bounce">
          <div className={`px-4 py-3 rounded-lg border text-xs shadow-lg flex items-center space-x-2 ${
            toast.type === 'success' 
              ? 'bg-emerald-950 border-emerald-500 text-emerald-300' 
              : toast.type === 'error'
              ? 'bg-red-950 border-red-500 text-red-300'
              : 'bg-indigo-950 border-indigo-500 text-indigo-300'
          }`}>
            <span>{toast.type === 'success' ? '✅' : toast.type === 'error' ? '❌' : 'ℹ️'}</span>
            <span className="font-semibold">{toast.message}</span>
          </div>
        </div>
      )}

    </div>
  );
}

// Mount the app
const rootEl = document.getElementById('root');
if (rootEl) {
  ReactDOM.createRoot(rootEl).render(<App />);
} else {
  console.error('Mount node #root not found');
}
    </script>
  </body>
</html>
